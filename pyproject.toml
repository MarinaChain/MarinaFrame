[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-reconstruction"
version = "0.1.0"
description = "Evidence-linked reconstruction of vessel hull envelopes from calibrated section drawings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "All rights reserved"}
dependencies = [
  "cadquery==2.7.0", "numpy>=2.0,<3", "scipy>=1.13,<2",
  "Pillow>=11,<13", "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "trimesh>=4,<5"]
documents = ["PyMuPDF>=1.25,<2", "ezdxf>=1.3,<2"]

[project.scripts]
vessel-reconstruct = "vessel_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vessel_reconstruction = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

