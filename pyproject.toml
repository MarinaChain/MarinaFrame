[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-reconstruction"
version = "0.4.0"
description = "Evidence-linked reconstruction of vessel hull envelopes from calibrated section drawings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "All rights reserved"}
dependencies = [
  "cadquery==2.7.0", "numpy>=2.0,<3", "scipy>=1.13,<2",
  "Pillow>=13.0,<14", "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "trimesh>=4,<5"]
documents = ["PyMuPDF>=1.26.7,<2", "ezdxf>=1.3,<2"]
data = ["jsonschema==4.26.0"]

[project.scripts]
vessel-reconstruct = "vessel_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

