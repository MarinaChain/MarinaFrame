[workspace]
members = ["rust-control", "app/core", "app/src-tauri"]
resolver = "2"

[profile.release]
overflow-checks = true
strip = "debuginfo"
lto = "thin"

# The controller hashes its own executable (binary_sha256). Unoptimised SHA-256
# takes several seconds on a 65 MB debug test binary, which exceeded the
# readiness waits in the reliability tests. Optimise only the hash crate.
[profile.dev.package.sha2]
opt-level = 3
