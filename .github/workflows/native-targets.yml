name: Native build and quick tests (macOS desktop, Linux web)
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-targets-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop app.
          - platform: macos-arm64
            runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            python: macos-lock
          # Web demo host.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
            python: linux-lock
        # Windows and arm64 Linux / x86_64 macOS are deferred; see docs/plans/2026-11-12-six-targets.md.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        with:
          persist-credentials: false
      - name: Assert native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
      - name: Install Linux desktop and worker libraries
        id: system
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install pinned Rust toolchain and native target
        id: toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: rustup toolchain install 1.99.1 --profile minimal --target '${{ matrix.target }}'
      - name: Set up native Python
        id: python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install pinned Python stack
        id: dependencies
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          STACK: ${{ matrix.python }}
        run: |
          if [ "$STACK" = linux-lock ]; then
            python -m pip install --only-binary=:all: --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          else
            python -m pip install --only-binary=:all: --require-hashes -r requirements-worker-macos-arm64-py312.lock -r requirements-worker-tools-macos-arm64-py312.lock
          fi
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python - <<'PY'
          import os
          import sys
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MARINAFRAME_TEST_PYTHON={sys.executable}\n')
          PY
      - name: Build native Rust workspace including desktop shell
        id: build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (runner.os != 'Linux' || steps.system.outcome == 'success') }}
        run: cargo build --locked --workspace --target '${{ matrix.target }}'
      - name: Run native Rust quick tests
        id: rust
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (runner.os != 'Linux' || steps.system.outcome == 'success') }}
        env:
          # Require real workers when the Python stack installed.
          MARINAFRAME_REQUIRE_WORKER: ${{ steps.dependencies.outcome == 'success' && '1' || '0' }}
        run: cargo test --locked --workspace --target '${{ matrix.target }}'
      - name: Run Python quick tier
        id: quick
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          MARINAFRAME_REQUIRE_WORKER: '1'
        run: python -m pytest -q -p no:cacheprovider -m 'not cad'
      - name: Record per-target outcomes
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BUILD: ${{ steps.build.outcome }}
          RUST: ${{ steps.rust.outcome }}
          STACK: ${{ matrix.python }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          QUICK: ${{ steps.quick.outcome }}
        run: |
          {
            printf '## %s (%s)\n\n' "$PLATFORM" "$TARGET"
            printf '| Check | Outcome |\n|---|---|\n'
            printf '| Rust workspace build | %s |\n' "$BUILD"
            printf '| Rust quick tests | %s |\n' "$RUST"
            printf '| Python stack | %s (%s) |\n' "$STACK" "$DEPENDENCIES"
            printf '| Python quick tests | %s |\n' "$QUICK"
            printf '\nFailed setup/download steps require log inspection to distinguish infrastructure from source failures. This does not test release bundles or signing.\n'
          } >> "$GITHUB_STEP_SUMMARY"
