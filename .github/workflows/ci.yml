name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    name: Locked Linux / Python 3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install exact hash-checked wheels
        run: python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
      - name: Build and test the pinned Rust controller
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --workspace
          cargo test --locked --workspace
      - name: Install source for subprocess tests without changing locked dependencies
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Dependency consistency and source pattern scan
        run: |
          python -m pip check
          python scripts/scan_secrets.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build --no-isolation
      - name: Test wheel in a fresh isolated environment
        run: |
          python -m venv artifacts/wheel-env
          artifacts/wheel-env/bin/python -m pip install --require-hashes -r requirements-linux-py312.lock
          artifacts/wheel-env/bin/python -m pip install --no-deps dist/*.whl
          artifacts/wheel-env/bin/python scripts/smoke_installed.py --out artifacts/installed-smoke
          artifacts/wheel-env/bin/python scripts/smoke_rust_installed.py --controller target/debug/marinaframe --out /tmp/marinaframe-installed-rust
      - name: Check pinned versions against current OSV data
        run: |
          python scripts/audit_dependencies.py --out artifacts/dependency-audit.json
          python scripts/audit_dependencies.py --lock requirements-data-linux-py312.lock --out artifacts/data-dependency-audit.json
  dependency-updates:
    name: Explicit dependency update probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Exercise supported ranges separately from the reproducible environment
        run: |
          python -m pip install '.[test,documents,data]'
          python -m pip check
          python -m pytest -q
