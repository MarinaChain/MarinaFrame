name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  # Portability watch only: we develop and ship on macOS for now, and port to Windows later.
  # This job runs the Python suite on Windows so that macOS-only code (paths, sandbox-exec,
  # ~/Library) shows up as each feature lands. It does not package, sign or block a merge.
  windows-portability:
    name: Windows portability watch / Python 3.12
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install the package with test and document extras (no Windows lock yet)
        run: python -m pip install -e ".[test,documents,data]"
      - name: Run the Python suite
        run: python -m pytest -q -p no:cacheprovider

  test:
    name: Locked Linux / Python 3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install exact hash-checked wheels
        run: python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
      # The Tauri desktop shell (marinaframe-app) needs GTK/WebKit system
      # libraries and is built on the developer platforms, not in this job.
      # Its logic lives in marinaframe-app-core, which is built and tested here.
      - name: Build and test the pinned Rust controller
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --workspace --exclude marinaframe-app
          cargo test --locked --workspace --exclude marinaframe-app
      - name: Install source for subprocess tests without changing locked dependencies
        run: python -m pip install --no-build-isolation --no-deps -e .
      # Real-CAD Rust tests are #[ignore]d in the quick tier (see Makefile).
      - name: Run real-CAD Rust tests (full tier)
        run: |
          export MARINAFRAME_TEST_PYTHON="$(command -v python)"
          make rust-cad PY="$MARINAFRAME_TEST_PYTHON"
      - name: Dependency consistency and source pattern scan
        run: |
          python -m pip check
          python scripts/scan_secrets.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build --no-isolation
      - name: Test wheel in a fresh isolated environment
        run: |
          python -m venv artifacts/wheel-env
          artifacts/wheel-env/bin/python -m pip install --require-hashes -r requirements-linux-py312.lock
          artifacts/wheel-env/bin/python -m pip install --no-deps dist/*.whl
          artifacts/wheel-env/bin/python scripts/smoke_installed.py --out artifacts/installed-smoke
          artifacts/wheel-env/bin/python scripts/smoke_rust_installed.py --controller target/debug/marinaframe --out /tmp/marinaframe-installed-rust
      - name: Check pinned versions against current OSV data
        run: |
          python scripts/audit_dependencies.py --out artifacts/dependency-audit.json
          python scripts/audit_dependencies.py --lock requirements-data-linux-py312.lock --out artifacts/data-dependency-audit.json
  dependency-updates:
    name: Explicit dependency update probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Exercise supported ranges separately from the reproducible environment
        run: |
          python -m pip install '.[test,documents,data,plan-raster]'
          python -m pip check
          python -m pytest -q
