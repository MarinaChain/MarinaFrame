name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MARINAFRAME_REQUIRE_WORKER: '1'
jobs:
  lint-secrets:
    name: Lint and secrets
    runs-on: ubuntu-24.04
    # No prior CI lint timing; allow 25 min for a cold Rust compile.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # Install the pinned toolchain in its own step. Letting the first cargo call
      # install it failed on macOS runners (conflict with the preinstalled cargo).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.job }}
      - run: make lint-ci secrets PY="$(command -v python)"
  python-quick:
    name: Python quick / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # Full suite measured 418-917 s; allow 25 min per shard including setup.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run deterministic file shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'EOF'
          import hashlib
          import os
          from pathlib import Path
          import pytest

          shard = int(os.environ['SHARD'])
          # This file accounts for 155 s of the measured top 40 durations.
          # Split its test cases; assign every other file as a unit.
          slow_file = Path('tests/test_body_plan_polyline.py')
          files = sorted(p for p in Path('tests').rglob('*.py')
                         if (p.name.startswith('test_') or p.name.endswith('_test.py'))
                         and p.name != 'test_linux_sandbox_live.py')
          selected = [str(p) for i, p in enumerate(files) if i % 4 == shard or p == slow_file]
          if not selected:
              raise SystemExit('Empty shard')

          class SplitSlowFile:
              def pytest_collection_modifyitems(self, session, config, items):
                  kept, removed = [], []
                  for item in items:
                      if item.nodeid.split('::', 1)[0] == str(slow_file):
                          digest = hashlib.sha256(item.nodeid.encode()).digest()
                          if int.from_bytes(digest[:8], 'big') % 4 != shard:
                              removed.append(item)
                              continue
                      kept.append(item)
                  items[:] = kept
                  config.hook.pytest_deselected(items=removed)

          raise SystemExit(pytest.main(
              ['-q', '-p', 'no:cacheprovider', '-m', 'not cad', *selected],
              plugins=[SplitSlowFile()],
          ))
          EOF
  python-cad:
    name: Python real CAD / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # Full suite measured 418-917 s; allow 30 min for CAD and setup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run deterministic CAD file shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          import pytest
          files = sorted(p for p in Path('tests').rglob('*.py')
                         if (p.name.startswith('test_') or p.name.endswith('_test.py'))
                         and p.name != 'test_linux_sandbox_live.py')
          selected = [str(p) for i, p in enumerate(files) if i % 2 == int(os.environ['SHARD'])]
          if not selected:
              raise SystemExit('Empty shard')
          raise SystemExit(pytest.main(['-q', '-p', 'no:cacheprovider', '-m', 'cad', *selected]))
          EOF
  rust-controller:
    name: Rust controller and app core
    runs-on: ubuntu-24.04
    # Rust build and tests measured 93-145 s; allow 30 min for cold builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # Install the pinned toolchain in its own step. Letting the first cargo call
      # install it failed on macOS runners (conflict with the preinstalled cargo).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.job }}
      - name: Install syscall trace tool
        run: sudo apt-get install -y strace
      - name: Build Linux sandbox launcher
        run: cargo build --locked -p marinaframe-control --bin marinaframe-sandbox
      - name: Trace contained real CAD syscall usage
        run: |
          mkdir -p work
          MARINAFRAME_SANDBOX_LAUNCHER="$PWD/target/debug/marinaframe-sandbox" strace -f -o work/linux-cad-syscalls.txt python scripts/trace_linux_cad.py --out work/linux-cad-trace
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          calls = Counter()
          for line in Path('work/linux-cad-syscalls.txt').read_text().splitlines():
              match = re.match(r'\d+\s+([a-zA-Z_][a-zA-Z_0-9]*)\(', line)
              if match:
                  calls[match[1]] += 1
          print('MEASURED_SYSCALLS:', ', '.join(sorted(calls)))
          print('CALL_COUNTS:', dict(sorted(calls.items())))
          PY
      - name: Print partial syscall evidence on trace failure
        if: failure()
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          path = Path('work/linux-cad-syscalls.txt')
          if path.exists():
              calls = Counter(re.findall(r'^\d+\s+([a-zA-Z_][a-zA-Z_0-9]*)\(', path.read_text(), re.M))
              print('PARTIAL_SYSCALLS:', dict(sorted(calls.items())))
          PY
      - name: Test live Linux sandbox policy (required kernel features)
        run: |
          cargo test --locked -p marinaframe-control --test linux_sandbox
          MARINAFRAME_SANDBOX_LAUNCHER="$PWD/target/debug/marinaframe-sandbox" python -m pytest -q -p no:cacheprovider tests/test_linux_sandbox.py tests/test_linux_sandbox_live.py
      - run: cargo test --locked --workspace --exclude marinaframe-app
  rust-cad:
    name: Rust real CAD
    runs-on: ubuntu-24.04
    # Real-CAD Rust tests measured 202-326 s; allow 30 min including cold builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # Install the pinned toolchain in its own step. Letting the first cargo call
      # install it failed on macOS runners (conflict with the preinstalled cargo).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.job }}
      - run: make rust-cad PY="$(command -v python)"
  ui:
    name: UI tests
    runs-on: ubuntu-24.04
    # Local 182-test run took 1.4 s; allow 10 min including Node setup.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.12.1'
      - run: make ui-quick
  wheel:
    name: Wheel install and dependency audits
    runs-on: ubuntu-24.04
    # Wheel smoke measured 90-150 s; allow 25 min for Rust build and audits.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-data-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install locked dependencies and source
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure real workers
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # Install the pinned toolchain in its own step. Letting the first cargo call
      # install it failed on macOS runners (conflict with the preinstalled cargo).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.job }}
      - name: Build controller and distributable packages
        run: |
          cargo build --locked --workspace --exclude marinaframe-app
          python -m pip check
          python -m build --no-isolation
      - name: Test wheel in a fresh isolated environment
        run: |
          python -m venv artifacts/wheel-env
          artifacts/wheel-env/bin/python -m pip install --require-hashes -r requirements-linux-py312.lock
          artifacts/wheel-env/bin/python -m pip install --no-deps dist/*.whl
          artifacts/wheel-env/bin/python scripts/smoke_installed.py --out artifacts/installed-smoke
          artifacts/wheel-env/bin/python scripts/smoke_rust_installed.py --controller target/debug/marinaframe --out /tmp/marinaframe-installed-rust
      - name: Check pinned versions against current OSV data
        run: |
          python scripts/audit_dependencies.py --out artifacts/dependency-audit.json
          python scripts/audit_dependencies.py --lock requirements-data-linux-py312.lock --out artifacts/data-dependency-audit.json
  macos-test-protection:
    name: Required macOS / sandbox and real workers
    runs-on: macos-latest
    # Measured about 7-9 min; allow cold Rust builds and runner variance.
    timeout-minutes: 25
    env:
      MARINAFRAME_REQUIRE_WORKER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12.10 is the last 3.12 release with a macOS build in
          # actions/python-versions; later 3.12 releases are source-only.
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # The hashed macOS lock is worker-only (no pytest). Use the complete
      # version lock until a macOS test-environment lock is available.
      - name: Install locked test dependencies and source
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Configure required real-worker tests before Cargo runs
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run process cleanup, Seatbelt probes and scripted part revision
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_runtime.py
          python -m pytest -q -p no:cacheprovider tests/test_ship_cad.py -k sandbox
          python -m pytest -q -p no:cacheprovider tests/test_part_revise.py::test_revise_from_the_command_line_with_a_scripted_model
      # Install the pinned toolchain in its own step. Letting the first cargo call
      # install it failed on macOS runners (conflict with the preinstalled cargo).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.job }}
      - name: Run app-core real-worker integrations
        run: |
          cargo test --locked -p marinaframe-app-core --test intake_worker --test export_worker --test replace_sheet --test part_revise_worker -- --test-threads=1
          cargo test --locked -p marinaframe-app-core --test real_task --test draft_task -- --ignored --test-threads=1

  test:
    name: Locked Linux / Python 3.12.14
    if: always()
    needs: [lint-secrets, python-quick, python-cad, rust-controller, rust-cad, ui, wheel]
    runs-on: ubuntu-24.04
    # Aggregates completed jobs only; one minute normally suffices.
    timeout-minutes: 5
    steps:
      - name: Require every Linux job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          EOF
