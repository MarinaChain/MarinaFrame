name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test and build (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install package and test tools
        run: python -m pip install -e '.[test,documents]' build
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build
      - name: Exercise installed CLI and generated development example
        run: |
          vessel-reconstruct --help
          python examples/make_development_example.py
          vessel-reconstruct reconstruct data/examples/development/spec.json --out artifacts/ci-development
          vessel-reconstruct verify artifacts/ci-development
