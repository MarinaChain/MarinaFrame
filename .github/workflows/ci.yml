name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  # Portability watch only: we develop and ship on macOS for now, and port to Windows later.
  # This job runs the Python suite on Windows so that macOS-only code (paths, sandbox-exec,
  # ~/Library) shows up as each feature lands. It does not package, sign or block a merge.
  windows-portability:
    name: Windows portability watch / Python 3.12
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install the package with test, document and raster extras (no Windows lock yet)
        run: python -m pip install -e ".[test,documents,data,plan-raster]"
      - name: Run the Python suite (report only; findings go to the run summary)
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -rfE 2>&1 | tee pytest-windows.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Windows portability watch (report only)"
            echo "pytest exit code: ${status}. Failures below are porting work, not regressions on macOS/Linux."
            echo '```'
            grep -E '^(FAILED|ERROR) |[0-9]+ (passed|failed)' pytest-windows.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  test:
    name: Locked Linux / Python 3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MARINAFRAME_REQUIRE_WORKER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install exact hash-checked wheels
        run: python -m pip install --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
      - name: Install source for subprocess tests without changing locked dependencies
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure required real-worker tests before Cargo runs
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.12.1'
      - name: Run UI unit tests
        run: node --test app/ui-tests/
      # The Tauri desktop shell (marinaframe-app) needs GTK/WebKit system
      # libraries and is built on the developer platforms, not in this job.
      # Its logic lives in marinaframe-app-core, which is built and tested here.
      - name: Build and test the pinned Rust controller
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --workspace --exclude marinaframe-app
          cargo test --locked --workspace --exclude marinaframe-app
      # Real-CAD Rust tests are #[ignore]d in the quick tier (see Makefile).
      - name: Run real-CAD Rust tests (full tier)
        run: make rust-cad PY="$MARINAFRAME_TEST_PYTHON"
      - name: Dependency consistency and source pattern scan
        run: |
          python -m pip check
          python scripts/scan_secrets.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build --no-isolation
      - name: Test wheel in a fresh isolated environment
        run: |
          python -m venv artifacts/wheel-env
          artifacts/wheel-env/bin/python -m pip install --require-hashes -r requirements-linux-py312.lock
          artifacts/wheel-env/bin/python -m pip install --no-deps dist/*.whl
          artifacts/wheel-env/bin/python scripts/smoke_installed.py --out artifacts/installed-smoke
          artifacts/wheel-env/bin/python scripts/smoke_rust_installed.py --controller target/debug/marinaframe --out /tmp/marinaframe-installed-rust
      - name: Check pinned versions against current OSV data
        run: |
          python scripts/audit_dependencies.py --out artifacts/dependency-audit.json
          python scripts/audit_dependencies.py --lock requirements-data-linux-py312.lock --out artifacts/data-dependency-audit.json

  macos-test-protection:
    name: Required macOS / sandbox and real workers
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      MARINAFRAME_REQUIRE_WORKER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12.10 is the last 3.12 release with a macOS build in
          # actions/python-versions; later 3.12 releases are source-only.
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # The hashed macOS lock is worker-only (no pytest). Use the complete
      # version lock until a macOS test-environment lock is available.
      - name: Install locked test dependencies and source
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Configure required real-worker tests before Cargo runs
        run: echo "MARINAFRAME_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run process cleanup, Seatbelt probes and scripted part revision
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_runtime.py
          python -m pytest -q -p no:cacheprovider tests/test_ship_cad.py -k sandbox
          python -m pytest -q -p no:cacheprovider tests/test_part_revise.py::test_revise_from_the_command_line_with_a_scripted_model
      - name: Run app-core real-worker integrations
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo test --locked -p marinaframe-app-core --test intake_worker --test export_worker --test replace_sheet --test part_revise_worker -- --test-threads=1
          cargo test --locked -p marinaframe-app-core --test real_task --test draft_task -- --ignored --test-threads=1

  dependency-updates:
    name: Explicit dependency update probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Exercise supported ranges separately from the reproducible environment
        run: |
          python -m pip install '.[test,documents,data,plan-raster]'
          python -m pip check
          python -m pytest -q
