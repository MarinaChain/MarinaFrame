name: Six-target native build and quick tests
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: six-targets-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            python: versions
            unsupported: ''
          - platform: windows-arm64
            runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
            python: unsupported
            unsupported: 'No pinned arm64 wheels for OCP, VTK, CasADi, NLopt, PyMuPDF or test-only OpenCV; no conda-forge win-arm64 CAD stack.'
          - platform: macos-arm64
            runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            python: macos-lock
            unsupported: ''
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            python: unsupported
            unsupported: 'NLopt 2.11.0 has no CPython 3.12 macOS x86_64 wheel; source build or separate conda lock needed.'
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
            python: linux-lock
            unsupported: ''
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
            python: unsupported
            unsupported: 'OCP 7.8.1.1.post1 and VTK 9.3.1 have no CPython 3.12 linux-aarch64 wheels; conda-forge needs a separately solved lock.'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        with:
          persist-credentials: false
      - name: Assert native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
      - name: Python quick tier unsupported on this target
        if: matrix.python == 'unsupported'
        env:
          REASON: ${{ matrix.unsupported }}
        run: |
          printf '::warning::Python quick tier unsupported on this target: %s\n' "$REASON"
          printf '## Python quick tier: UNSUPPORTED\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Linux desktop and worker libraries
        id: system
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install pinned Rust toolchain and native target
        id: toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: rustup toolchain install 1.99.1 --profile minimal --target '${{ matrix.target }}'
      - name: Set up native Python
        id: python
        if: ${{ !cancelled() && matrix.python != 'unsupported' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install pinned Python stack
        id: dependencies
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          STACK: ${{ matrix.python }}
        run: |
          if [ "$STACK" = linux-lock ]; then
            python -m pip install --only-binary=:all: --require-hashes -r requirements-linux-py312.lock -r requirements-data-linux-py312.lock
          elif [ "$STACK" = macos-lock ]; then
            python -m pip install --only-binary=:all: --require-hashes -r requirements-worker-macos-arm64-py312.lock -r requirements-worker-tools-macos-arm64-py312.lock
          else
            # Existing hashes select Linux wheels, not Windows wheels. Retain every
            # exact version; this portability probe is not a release hash lock.
            mkdir -p work/six-targets
            python - <<'PY'
          from pathlib import Path
          locks = ('requirements-linux-py312.lock', 'requirements-data-linux-py312.lock')
          pins = [line.split(' --hash=', 1)[0] for lock in locks
                  for line in Path(lock).read_text().splitlines()
                  if line.strip() and not line.startswith('#')]
          Path('work/six-targets/pins.txt').write_text('\n'.join(pins) + '\n')
          PY
            python -m pip install --only-binary=:all: -r work/six-targets/pins.txt
          fi
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python - <<'PY'
          import os
          import sys
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MARINAFRAME_TEST_PYTHON={sys.executable}\n')
          PY
      - name: Build native Rust workspace including desktop shell
        id: build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (runner.os != 'Linux' || steps.system.outcome == 'success') }}
        run: cargo build --locked --workspace --target '${{ matrix.target }}'
      - name: Run native Rust quick tests
        id: rust
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (runner.os != 'Linux' || steps.system.outcome == 'success') }}
        env:
          # Require real workers when installed; unsupported Python targets still
          # exercise Rust-only tests and the source's existing optional-worker paths.
          MARINAFRAME_REQUIRE_WORKER: ${{ steps.dependencies.outcome == 'success' && '1' || '0' }}
        run: cargo test --locked --workspace --target '${{ matrix.target }}'
      - name: Run Python quick tier
        id: quick
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          MARINAFRAME_REQUIRE_WORKER: '1'
        run: python -m pytest -q -p no:cacheprovider -m 'not cad'
      - name: Record per-target outcomes
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BUILD: ${{ steps.build.outcome }}
          RUST: ${{ steps.rust.outcome }}
          STACK: ${{ matrix.python }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          QUICK: ${{ steps.quick.outcome }}
        run: |
          {
            printf '## %s (%s)\n\n' "$PLATFORM" "$TARGET"
            printf '| Check | Outcome |\n|---|---|\n'
            printf '| Rust workspace build | %s |\n' "$BUILD"
            printf '| Rust quick tests | %s |\n' "$RUST"
            printf '| Python stack | %s (%s) |\n' "$STACK" "$DEPENDENCIES"
            printf '| Python quick tests | %s |\n' "$QUICK"
            printf '\nUnsupported Python is not a test pass. Failed setup/download steps require log inspection to distinguish infrastructure from source failures. This does not test release bundles or signing.\n'
          } >> "$GITHUB_STEP_SUMMARY"
