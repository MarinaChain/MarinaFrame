name: CI portability and dependency watch
on:
  push:
    paths: ['.github/workflows/ci-watch.yml', 'requirements*.txt', 'requirements*.lock', 'Cargo.lock', 'pyproject.toml', 'rust-toolchain.toml', '**/requirements*.txt', '**/requirements*.lock', '**/Cargo.lock', '**/pyproject.toml', '**/rust-toolchain.toml']
  pull_request:
    paths: ['.github/workflows/ci-watch.yml', 'requirements*.txt', 'requirements*.lock', 'Cargo.lock', 'pyproject.toml', 'rust-toolchain.toml', '**/requirements*.txt', '**/requirements*.lock', '**/Cargo.lock', '**/pyproject.toml', '**/rust-toolchain.toml']
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-watch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/continue/v0.5' }}
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  # Portability watch only: we develop and ship on macOS for now, and port to Windows later.
  # This job runs the Python suite on Windows so that macOS-only code (paths, sandbox-exec,
  # ~/Library) shows up as each feature lands. It does not package, sign or block a merge.
  windows-portability:
    name: Windows portability watch / Python 3.12
    runs-on: windows-2022
    continue-on-error: true
    # Measured 7-8 min plus install; allow runner and network variance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install the package with test, document and raster extras (no Windows lock yet)
        run: python -m pip install -e ".[test,documents,data,plan-raster]"
      - name: Run the Python suite (report only; findings go to the run summary)
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -rfE 2>&1 | tee pytest-windows.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Windows portability watch (report only)"
            echo "pytest exit code: ${status}. Failures below are porting work, not regressions on macOS/Linux."
            echo '```'
            grep -E '^(FAILED|ERROR) |[0-9]+ (passed|failed)' pytest-windows.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  dependency-updates:
    name: Explicit dependency update probe
    runs-on: ubuntu-24.04
    # Measured 13-16 min; allow network and runner variance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libgl1 libglu1-mesa
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build Linux sandbox launcher
        run: cargo build --locked -p marinaframe-control --bin marinaframe-sandbox
      - name: Exercise supported ranges separately from the reproducible environment
        env:
          # Live Linux tests must exercise the native sandbox, not skip its absence.
          MARINAFRAME_SANDBOX_LAUNCHER: ${{ github.workspace }}/target/debug/marinaframe-sandbox
        run: |
          # tests/test_tool_catalog_shared.py builds a wheel with --no-build-isolation, so the
          # build backend must be in this environment; Python 3.12 does not bundle setuptools.
          python -m pip install setuptools wheel '.[test,documents,data,plan-raster]'
          python -m pip check
          python -m pytest -q
